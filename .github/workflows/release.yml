name: Release

# Run by hand — Actions → Release → Run workflow, then pick the branch — or by pushing a `v*` tag.
# Restricted to the main repository: a fork, including a fork's pull request, can never reach the
# signing certificate or the notarization credentials below.
#
# A merge to `main` publishes nothing. When users get an update is a decision, not a side effect of
# merging, and one press of Run workflow on `main` is that decision. What the run produces depends
# on where it ran, and only one of the two is ever offered to anyone:
#
#   from `main`, or a `v*` tag in main's history   a finished release, the latest, offered by the
#                                                  app's update check and by scripts/install.sh
#   from any other branch                          a prerelease, tagged `build-<run number>`.
#                                                  `/releases/latest` and `UpdateChecker` both skip
#                                                  it, so it reaches only whoever installs it on
#                                                  purpose: `install.sh --version build-<n>`
#
# Nothing is deleted and no tag is reused, so a new release adds to the list and an older one stays
# downloadable. `scripts/install.sh` asks /releases/latest, and `UpdateChecker` takes the highest
# version out of the list — neither trusts the order GitHub returns, which is not newest-first.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Two runs on one ref would each build the same repository at a different commit and publish within
# seconds of each other. Serialising them keeps /releases/latest pointing at the commit that
# actually landed last. Runs on different branches do not wait for each other.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Package and publish
    # The same image CI builds and tests on — see ci.yml.
    runs-on: xcode-27
    if: github.repository == 'grozoww/our-whisper'
    # Notarization waits on Apple, and notarytool gives up after 30 minutes by itself. This is the
    # bound on everything else, so a hung step cannot hold the release queue for six hours.
    timeout-minutes: 60

    steps:
      # Full history, not the single commit `actions/checkout` clones by default. scripts/version.sh
      # derives the patch number from the pull requests merged since the version line was set, and
      # a shallow clone has no merges in it to count — every build would come out as x.y.0.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # VERSION, BUILD, SHA and RELEASE_NAME, for the steps below and for the release name. The
      # same script package.sh uses, so what the release is called and what the app reports are
      # worked out once rather than twice.
      - name: Work out the version
        run: ./scripts/version.sh >> "$GITHUB_ENV"

      - name: Announce it
        run: echo "::notice::$RELEASE_NAME (build $BUILD)"

      # The one place that decides whether users are offered this build, and what it is tagged.
      # Everything below reads PRERELEASE and RELEASE_TAG instead of working them out again from
      # the trigger.
      #
      # `main` is the ref itself for a manual run. A tag is only a release when its commit is in
      # main's history: `v*` can be pushed on any commit, and a tag on an unmerged branch would
      # otherwise publish that branch to everyone. It fails closed — if `origin/main` is missing
      # from the checkout, `merge-base` errors, and an error here means prerelease.
      #
      # A tag push keeps its own tag. A manual run on main is tagged with what the build is called,
      # which carries the version and the commit: unique per commit, so each release is added to
      # the list rather than replacing the one before it. A build from any other branch gets the run
      # number — never the branch name, because a branch called `v2.5-spike` would put a version in
      # the tag, and a tag shape that carries a version has to survive `UpdateChecker.normalise`.
      - name: Decide whether users are offered this build
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            prerelease=false
          elif [ "$GITHUB_REF_TYPE" = "tag" ] && git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            prerelease=false
          else
            prerelease=true
            echo "::notice::Built from $GITHUB_REF_NAME, not from main: published as a prerelease, which the app does not offer."
          fi

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          elif [ "$prerelease" = false ]; then
            tag="$RELEASE_NAME"
          else
            tag="build-$GITHUB_RUN_NUMBER"
          fi

          {
            echo "PRERELEASE=$prerelease"
            echo "RELEASE_TAG=$tag"
          } >> "$GITHUB_ENV"

      # Every release is signed with a Developer ID and notarized, or it does not happen. A job
      # that shrugs off a missing secret and ships whatever it can build is how every update used to
      # break dictation: an ad-hoc signature pins the Accessibility grant to one exact binary, and
      # the release still looked fine.
      #
      #   CSC_LINK          base64 of the Developer ID Application certificate's .p12
      #   CSC_KEY_PASSWORD  the password that .p12 was exported with
      #   APPLE_API_KEY     the contents of the App Store Connect API key, the .p8 file
      #   APPLE_API_KEY_ID  its Key ID
      #   APPLE_API_ISSUER  the Issuer ID of the team that made it
      #
      # CONTRIBUTING.md says where each comes from.
      - name: Check the signing secrets are present
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=0
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!name:-}" ]; then
              echo "::error::secret $name is not set"
              missing=1
            fi
          done
          exit $missing

      - name: Import the signing certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          # A keychain left by a run that was killed would fail the next `create-keychain`.
          security delete-keychain build.keychain 2>/dev/null || true
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          # Both, and the second is the one that matters. `default-keychain -s` does not add the
          # keychain to the search list, and codesign resolves an identity by searching the list —
          # so with only the line above, signing fails with the flatly misleading "no identity
          # found" while `security find-identity build.keychain` happily shows it.
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          # An hour before it locks again, not the default 300 seconds of idle: a notarized build
          # waits on Apple for longer than that. A keychain that relocks mid-run fails the DMG signature
          # after the app has already been built.
          security set-keychain-settings -t 3600 -u build.keychain
          echo "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain \
            -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          # Without this, codesign's first use of the key pops a GUI confirmation, which on a
          # headless runner is an indefinite hang rather than an error.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f "$RUNNER_TEMP/cert.p12"

          # What package.sh signs by. `-v` lists only identities macOS considers valid, so a
          # certificate that expired, or whose Apple intermediate is missing, comes back empty here
          # and says so, rather than failing later inside codesign with "no identity found".
          IDENTITY="$(security find-identity -v -p codesigning build.keychain \
            | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -1)"
          if [ -z "$IDENTITY" ]; then
            security find-identity -p codesigning build.keychain
            echo "::error::CSC_LINK holds no valid Developer ID Application identity. Is it the .p12 of that certificate, with its private key, and has it expired?"
            exit 1
          fi
          echo "Signing as $IDENTITY"
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      # A secret can only hold the key's contents, and notarytool wants a file. It goes through
      # GITHUB_ENV, not the next step's `env:` block, so the file's path is what the build sees.
      - name: Write the notarization key to disk
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY" > "$key"
          chmod 600 "$key"
          if ! grep -q 'BEGIN PRIVATE KEY' "$key"; then
            echo "::error::secret APPLE_API_KEY is not the contents of a .p8 file"
            exit 1
          fi
          {
            echo "NOTARY_KEY_PATH=$key"
            echo "NOTARY_KEY_ID=$APPLE_API_KEY_ID"
            echo "NOTARY_ISSUER=$APPLE_API_ISSUER"
          } >> "$GITHUB_ENV"

      # Builds, signs, launches the signed app once, notarizes, staples, and has Gatekeeper judge
      # the result. Any of those failing fails the job, and with it the release.
      - name: Package, sign and notarize
        run: ./scripts/package.sh

      # Nothing after this needs the key or the certificate, and the next step runs a third-party
      # action from a mutable tag. With the keychain unlocked and codesign allowed to use the key,
      # anything running on the runner could sign and notarize as the team, so they are gone before
      # it starts. The last step stays as the net for a run that fails before getting here.
      - name: Remove the signing key and the certificate
        if: always()
        run: |
          security delete-keychain build.keychain || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      # The checks above ran on the file this job is about to upload. This looks at it once more,
      # from the disk image itself: an asset catalog that failed to compile leaves the app with no
      # icon and package.sh exits zero, so without this the broken image is simply published.
      # A failure means no release is created at all, rather than one that UpdateChecker will go
      # on to offer people.
      - name: Check the disk image mounts and holds the app
        run: |
          MOUNT="$(hdiutil attach dist/*.dmg -nobrowse -readonly -mountrandom /tmp \
            | grep -o '/tmp/[^[:space:]]*$' | tail -1)"
          test -d "$MOUNT/OurWhisper.app" || { echo "::error::No OurWhisper.app in the DMG."; exit 1; }
          # An app icon that failed to compile is invisible until someone looks in the Dock.
          test -f "$MOUNT/OurWhisper.app/Contents/Resources/AppIcon.icns" \
            || { echo "::error::The app icon is missing. Run ./scripts/make-icon.swift."; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$MOUNT/OurWhisper.app"
          hdiutil detach "$MOUNT" -quiet
          xcrun stapler validate dist/*.dmg

      # The wording for the person downloading is written by package.sh; this puts it where they
      # will see it.
      - name: Assemble release notes
        run: |
          # Which commit a download came from is the first thing anyone asks when a build
          # misbehaves, and the release name is the only place it would otherwise appear.
          printf 'Version **%s** (build %s) from [`%s`](%s/commit/%s).\n\n' \
            "$VERSION" "$BUILD" "$SHA" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_SHA" \
            > release-notes.md
          # Only a build that is not from main needs a warning. A release from main is finished like
          # any other, and telling people to wait for a `v…` tag when none is ever cut is what sent
          # them looking for a download that does not exist.
          if [ "$PRERELEASE" = true ]; then
            printf '> **Not a release.** Built from `%s`, not from `main`. It is a prerelease, so the app'"'"'s update check and `install.sh` skip it — install it on purpose or not at all.\n>\n> `curl -fsSL https://raw.githubusercontent.com/%s/main/scripts/install.sh | bash -s -- --version %s`\n\n' \
              "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" "$RELEASE_TAG" >> release-notes.md
          fi
          cat dist/INSTALL.md >> release-notes.md
          printf '\n---\n\n' >> release-notes.md

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          # SHA256SUMS is what scripts/install.sh checks the download against.
          files: |
            dist/*.dmg
            dist/SHA256SUMS
          body_path: release-notes.md
          generate_release_notes: true
          # Chosen in "Decide whether users are offered this build", above.
          tag_name: ${{ env.RELEASE_TAG }}
          # release-1.0.3-a1b2c3d — the version and the commit are what anyone reading the list
          # actually wants. A build from another branch says so and adds its run number, because
          # two of them from one commit would otherwise be two releases with identical names.
          name: ${{ env.PRERELEASE == 'true' && format('{0} from {1} (build {2})', env.RELEASE_NAME, github.ref_name, github.run_number) || env.RELEASE_NAME }}
          target_commitish: ${{ github.sha }}
          # What is on main is what people should be running, so a release from there is a finished
          # one and it becomes the latest. Anything else is a prerelease and is never the latest.
          #
          # Marking a build from main a prerelease is what kept the update check quiet. Prereleases
          # are skipped by `/releases/latest` *and* by `UpdateChecker`, and with no `v*` tag ever
          # cut there was nothing left for either to find — so every user was told they were up to
          # date, for ever, while the DMG they wanted sat in the releases list.
          prerelease: ${{ env.PRERELEASE == 'true' }}
          make_latest: ${{ env.PRERELEASE != 'true' }}

      - name: Clean up the keychain and the key
        if: always()
        run: |
          security delete-keychain build.keychain || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"
