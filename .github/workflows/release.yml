name: Release

# Tag-triggered and restricted to the main repository. A fork — including a fork's pull request —
# can never reach the signing certificate or the notarization credentials below.
on:
  push:
    tags: ['v*']
    # Every push to main publishes its own release, tagged with the version and the commit it was
    # built from, so there is always a current DMG to download without anyone cutting a tag. Each
    # one is kept: nothing is deleted and no tag is reused, so an older build stays downloadable
    # after a newer one lands. `scripts/install.sh` asks /releases/latest and falls back to picking
    # the highest version out of the list — it does not trust the order GitHub returns, which is
    # not newest-first.
    branches: [main]
  # Lets you produce a downloadable build before you have an Apple Developer account, and lets you
  # rehearse the whole thing without cutting a tag.
  workflow_dispatch:
    inputs:
      unsigned:
        description: 'Build without signing or notarizing (no Apple Developer account needed)'
        type: boolean
        default: false

# Two pushes to main packaging at once would each build the same repository at a different commit
# and publish within seconds of each other. They no longer collide over a tag, but serialising them
# keeps /releases/latest pointing at the commit that actually landed last.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Package and publish
    runs-on: macos-latest
    if: github.repository == 'grozoww/our-whisper'

    steps:
      # Full history, not the single commit `actions/checkout` clones by default. scripts/version.sh
      # derives the patch number from the pull requests merged since the version line was set, and
      # a shallow clone has no merges in it to count — every build would come out as x.y.0.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # VERSION, BUILD, SHA and RELEASE_NAME, for the steps below and for the release name. The
      # same script package.sh uses, so what the release is called and what the app reports are
      # worked out once rather than twice.
      - name: Work out the version
        run: ./scripts/version.sh >> "$GITHUB_ENV"

      - name: Announce it
        run: echo "::notice::$RELEASE_NAME (build $BUILD)"

      # Secrets are not available in a job-level `if:`, so which path to take is worked out here
      # and read from `env` by the steps below.
      #
      # Signing and notarizing are two decisions, not one. Having them as one flag is what made
      # releases ship ad-hoc: no Apple account meant no notary password, so the certificate was
      # skipped too — and an ad-hoc signature pins the Accessibility grant to one exact binary, so
      # every update silently broke dictation for everyone. A certificate alone fixes that. It
      # does not have to be Apple's; ./scripts/release-cert.sh makes a self-signed one.
      #
      # Signing — set these three, from release-cert.sh or from a Developer ID:
      #   MACOS_CERTIFICATE          base64 of the .p12
      #   MACOS_CERTIFICATE_PASSWORD password for that .p12
      #   MACOS_SIGNING_IDENTITY     "OurWhisper Release", or "Developer ID Application: … (TEAM)"
      #
      # Notarizing — needs a paid Apple Developer account, and all three on top of the above:
      #   APPLE_TEAM_ID              10-character team id
      #   NOTARY_APPLE_ID            Apple ID used for notarization
      #   NOTARY_PASSWORD            app-specific password for that Apple ID
      - name: Decide signing path
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          FORCED_UNSIGNED: ${{ inputs.unsigned }}
        run: |
          if [ "$FORCED_UNSIGNED" = "true" ] || [ -z "$MACOS_CERTIFICATE" ]; then
            echo "SIGNED=false" >> "$GITHUB_ENV"
            echo "NOTARIZED=false" >> "$GITHUB_ENV"
            echo "::warning::No signing certificate. This build is ad-hoc signed, so everyone who installs it loses their Accessibility permission on the next update. See scripts/release-cert.sh."
          elif [ -z "$NOTARY_PASSWORD" ]; then
            echo "SIGNED=true" >> "$GITHUB_ENV"
            echo "NOTARIZED=false" >> "$GITHUB_ENV"
            echo "Signed but not notarized — downloads still need scripts/install.sh, but the Accessibility grant survives updates."
          else
            echo "SIGNED=true" >> "$GITHUB_ENV"
            echo "NOTARIZED=true" >> "$GITHUB_ENV"
          fi

      - name: Import signing certificate
        if: env.SIGNED == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          # Both, and the second is the one that matters. `default-keychain -s` does not add the
          # keychain to the search list, and codesign resolves an identity by searching the list —
          # so with only the line above, signing fails with the flatly misleading
          # "OurWhisper Release: no identity found" while `security find-identity build.keychain`
          # happily shows it.
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          # No auto-lock timeout: the default is 300 seconds of idle, and a notarized build waits
          # on Apple for longer than that. A keychain that relocks mid-run fails the DMG signature
          # after the app has already been built.
          security set-keychain-settings -t 3600 -u build.keychain
          echo "$MACOS_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k build.keychain \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          # Without this, codesign's first use of the key pops a GUI confirmation, which on a
          # headless runner is an indefinite hang rather than an error.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f /tmp/cert.p12
          security find-identity -p codesigning build.keychain

      # package.sh notarizes only when the notary credentials below are actually present, so this
      # one step covers both the signed-only and the notarized path.
      - name: Build and sign
        if: env.SIGNED == 'true'
        env:
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: ./scripts/package.sh

      - name: Build unsigned
        if: env.SIGNED == 'false'
        run: ./scripts/package.sh --unsigned

      # These checks used to live on the pull request, where they inspected a DMG nobody would ever
      # download. A build that succeeds can still be wrong — an asset catalog that failed to compile
      # leaves the app with no icon, and a signature can be invalid without package.sh returning
      # non-zero. Neither makes package.sh exit non-zero, so without this the broken image is simply
      # published. Running it here, before Publish, is what stops that: the checks see the exact
      # bytes being uploaded, and a failure means no release is created at all rather than one that
      # UpdateChecker will go on to offer people.
      - name: Check the disk image mounts and holds the app
        run: |
          MOUNT="$(hdiutil attach dist/*.dmg -nobrowse -readonly -mountrandom /tmp \
            | grep -o '/tmp/[^[:space:]]*$' | tail -1)"
          test -d "$MOUNT/OurWhisper.app" || { echo "::error::No OurWhisper.app in the DMG."; exit 1; }
          # An app icon that failed to compile is invisible until someone looks in the Dock.
          test -f "$MOUNT/OurWhisper.app/Contents/Resources/AppIcon.icns" \
            || { echo "::error::The app icon is missing. Run ./scripts/make-icon.swift."; exit 1; }
          codesign --verify --strict --verbose=2 "$MOUNT/OurWhisper.app"
          hdiutil detach "$MOUNT" -quiet

      # An unsigned download that refuses to open, with no explanation, reads as broken software.
      # package.sh writes the wording; this puts it where the person downloading will see it.
      - name: Assemble release notes
        run: |
          # Which commit a download came from is the first thing anyone asks when a build
          # misbehaves, and the release name is the only place it would otherwise appear.
          printf 'Version **%s** (build %s) from [`%s`](%s/commit/%s).\n\n' \
            "$VERSION" "$BUILD" "$SHA" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_SHA" \
            > release-notes.md
          # Only a rehearsal needs a warning now. A build from main is a finished release like any
          # other, and telling people to wait for a `v…` tag when none is ever cut is what sent
          # them looking for a download that does not exist.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            cat >> release-notes.md <<'REHEARSAL'
          > **Rehearsal build.** Run by hand, not published by a merge to `main`. It stays a
          > prerelease and the app's update check will not offer it — install it on purpose or
          > not at all.

          REHEARSAL
          fi
          if [ -f dist/INSTALL.md ]; then
            cat dist/INSTALL.md >> release-notes.md
            printf '\n---\n\n' >> release-notes.md
          fi

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          # SHA256SUMS is what scripts/install.sh checks the download against.
          files: |
            dist/*.dmg
            dist/SHA256SUMS
          body_path: release-notes.md
          generate_release_notes: true
          # A tag push keeps its own tag. A push to main is tagged with what the build is called,
          # which carries the version and the commit — unique per commit, so each build is added
          # to the releases list rather than replacing the one before it. workflow_dispatch gets a
          # run number, so two rehearsals of the same commit do not collide.
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || (github.event_name == 'push' && env.RELEASE_NAME || format('build-{0}', github.run_number)) }}
          # release-1.0.3-a1b2c3d, whatever the trigger — the version and the commit are what
          # anyone reading the list actually wants, and the tag above already says which kind of
          # build it is. A manual run adds its run number, because two rehearsals of the same
          # commit would otherwise be two releases with identical names.
          name: ${{ github.event_name == 'workflow_dispatch' && format('{0} (build {1})', env.RELEASE_NAME, github.run_number) || env.RELEASE_NAME }}
          target_commitish: ${{ github.sha }}
          # Merging to main is the decision. What lands there is what people should be running, so
          # the release it produces is a finished one and it becomes the latest — same as a version
          # tag. Only a workflow_dispatch rehearsal stays a prerelease, because that is a build
          # nobody merged.
          #
          # Marking a build from main a prerelease is what kept the update check quiet. Prereleases
          # are skipped by `/releases/latest` *and* by `UpdateChecker`, and with no `v*` tag ever
          # cut there was nothing left for either to find — so every user was told they were up to
          # date, for ever, while the DMG they wanted sat in the releases list.
          #
          # Notarization deliberately does not enter into it. It decides whether Gatekeeper
          # complains about the download, not whether a release is finished.
          prerelease: ${{ github.event_name == 'workflow_dispatch' }}
          make_latest: ${{ github.event_name != 'workflow_dispatch' }}

      - name: Clean up keychain
        if: always() && env.SIGNED == 'true'
        run: security delete-keychain build.keychain || true
